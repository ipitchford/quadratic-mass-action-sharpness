name: Exact research-payload replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out candidate bytes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify complete payload manifest with the standard library
        run: python verify_payload.py --root . --manifest-only > "$RUNNER_TEMP/manifest-check.json"
      - name: Install pinned symbolic dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Replay normal and optimized checks, classification, and any distributed referee checker
        run: python verify_payload.py --root . --output-dir "$RUNNER_TEMP/quadratic-replay"
      - name: Retain exact execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-replay-evidence
          path: |
            ${{ runner.temp }}/manifest-check.json
            ${{ runner.temp }}/quadratic-replay/
          if-no-files-found: error
          retention-days: 30
